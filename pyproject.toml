[project]
name = "dbx-invest-analytics"
version = "0.1.0"
description = "Analytical ETL pipelines for QQQ ETF — market, macroeconomic, and sentiment data on Databricks"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pyspark>=3.5",
    "delta-spark>=3.0",
    "yfinance==1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "html5lib>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]